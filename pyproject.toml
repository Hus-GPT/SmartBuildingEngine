[project]
name = "smartbuilding-manager"
version = "2.0.0"
description = "Production-oriented SmartBuildingManager service"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0", "uvicorn[standard]>=0.30,<1.0", "sqlmodel>=0.0.22,<0.1",
  "psycopg[binary]>=3.2,<4.0", "alembic>=1.14,<2.0", "pydantic-settings>=2.6,<3.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9.0", "httpx>=0.28,<1.0", "ruff>=0.8,<1.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["B008", "E501"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
